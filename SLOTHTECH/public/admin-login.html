<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>PLUSFLIX - Logowanie Admina</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e293b);
        }
        
        .login-box {
            background: rgba(30, 41, 59, 0.9);
            padding: 3rem;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid #334155;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }
        
        .login-title {
            color: gold;
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        
        .login-subtitle {
            color: #94a3b8;
            margin-bottom: 2rem;
        }
        
        .login-input {
            width: 100%;
            padding: 1rem;
            margin-bottom: 1rem;
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 10px;
            color: white;
            font-size: 1rem;
        }
        
        .login-input:focus {
            border-color: gold;
            outline: none;
        }
        
        .login-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, gold, #d4af37);
            color: black;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 1rem;
        }
        
        .login-btn:hover {
            background: linear-gradient(135deg, #d4af37, gold);
        }
        
        .login-error {
            color: #ef4444;
            margin-top: 1rem;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1 class="login-title">👑 PLUSFLIX</h1>
            <p class="login-subtitle">Panel Administratora</p>
            
            <input type="text" id="username" class="login-input" placeholder="Nazwa użytkownika">
            <input type="password" id="password" class="login-input" placeholder="Hasło">
            
            <div class="login-error" id="errorMsg">
                Nieprawidłowe dane logowania
            </div>
            
            <button class="login-btn" onclick="login()">Zaloguj się</button>
            
            <p style="margin-top: 2rem; color: #64748b;">
                <a href="index.html" style="color: #3b82f6;">← Powrót do strony głównej</a>
            </p>
        </div>
    </div>
    
    <script>
        function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            // W prawdziwej aplikacji sprawdzanie przez API
            if (username === 'admin' && password === 'admin123') {
                localStorage.setItem('adminLoggedIn', 'true');
                window.location.href = 'admin.html';
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        }
        
        // Enter do logowania
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') login();
        });
    </script>
</body>
</html>
